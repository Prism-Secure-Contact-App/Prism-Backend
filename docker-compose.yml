name: prism

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL - Synapse ve bridge'ler için ortak veritabanı
  # ---------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: prism-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-synapse}
      POSTGRES_USER: ${POSTGRES_USER:-synapse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./config/init-db.sql:/docker-entrypoint-initdb.d/02-init-db.sql:ro
    networks:
      - prism-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synapse} -d ${POSTGRES_DB:-synapse}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 256M

  # ---------------------------------------------------------------------------
  # Matrix Synapse - ana mesajlaşma sunucusu
  # ---------------------------------------------------------------------------
  synapse:
    image: matrixdotorg/synapse:latest
    container_name: prism-synapse
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    volumes:
      - ./data/synapse:/data
      - ./config/matrix.log.config:/data/matrix.log.config:ro
    networks:
      - prism-net
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          memory: 512M

  # ---------------------------------------------------------------------------
  # Mautrix WhatsApp Bridge
  # ---------------------------------------------------------------------------
  whatsapp:
    image: dock.mau.dev/mautrix/whatsapp:latest
    container_name: prism-whatsapp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      synapse:
        condition: service_started
    volumes:
      - ./data/whatsapp:/data
    networks:
      - prism-net
    # Default entrypoint of the image handles config generation and bridge startup.
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 128M

  # ---------------------------------------------------------------------------
  # Monero Node - pruned node
  # ---------------------------------------------------------------------------
  monerod:
    image: ghcr.io/sethforprivacy/simple-monerod:latest
    container_name: monero-node
    restart: unless-stopped
    volumes:
      - ./data/monero:/home/monero/.bitmonero
    networks:
      - prism-net
    expose:
      - "18080"
      - "18081"
    command:
      - --rpc-bind-ip=0.0.0.0
      - --rpc-bind-port=18081
      - --confirm-external-bind
      - --restricted-rpc
      - --no-igd
      - --enable-dns-blocklist
      - --prune-blockchain
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          memory: 512M

  # ---------------------------------------------------------------------------
  # Monero Wallet RPC
  # ---------------------------------------------------------------------------
  monero-wallet-rpc:
    image: ghcr.io/sethforprivacy/simple-monero-wallet-rpc:latest
    container_name: monero-wallet-rpc
    restart: unless-stopped
    volumes:
      - ./data/monero:/home/monero/.bitmonero
      - ./data/monero-wallets:/wallets
    networks:
      - prism-net
    expose:
      - "18083"
    command:
      - --wallet-file=/wallets/prism_wallet
      - --password=${MONERO_WALLET_PASSWORD:-}
      - --rpc-bind-port=18083
      - --daemon-address=monero-node:18081
      - --disable-rpc-login
      - --trusted-daemon
      - --log-level=1
    depends_on:
      - monerod
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 128M

  # ---------------------------------------------------------------------------
  # PRISM Monero API
  # ---------------------------------------------------------------------------
  monero-api:
    build:
      context: .
      dockerfile: Dockerfile.monero-api
    container_name: prism-monero-api
    restart: unless-stopped
    env_file: .env
    environment:
      MONERO_WALLET_RPC_URL: http://monero-wallet-rpc:18083
    networks:
      - prism-net
    depends_on:
      - monero-wallet-rpc
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          memory: 64M

  # ---------------------------------------------------------------------------
  # PRISM LLM API
  # ---------------------------------------------------------------------------
  llm-api:
    build:
      context: .
      dockerfile: Dockerfile.llm-api
    container_name: prism-llm-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data/llm-api:/data
    environment:
      - PRISM_LLM_API_PORT=8080
      - LLM_API_DB_PATH=/data/llm_api_keys.db
      - META_AI_ENDPOINT=${META_AI_ENDPOINT:-}
      - META_AI_API_KEY=${META_AI_API_KEY:-}
      - SYNAPSE_URL=http://synapse:8008
      - SYNAPSE_ADMIN_TOKEN=${SYNAPSE_ADMIN_TOKEN:-}
    networks:
      - prism-net
    depends_on:
      - synapse
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 128M

  # ---------------------------------------------------------------------------
  # PRISM Retention Bridge
  # ---------------------------------------------------------------------------
  retention:
    build:
      context: .
      dockerfile: Dockerfile.retention
    container_name: prism-retention
    restart: unless-stopped
    environment:
      - SYNAPSE_URL=http://synapse:8008
      - SYNAPSE_ADMIN_TOKEN=${SYNAPSE_ADMIN_TOKEN:-}
      - SCAN_INTERVAL_MIN=60
    networks:
      - prism-net
    depends_on:
      - synapse
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          memory: 64M

  # ---------------------------------------------------------------------------
  # Cloudflare Tunnel - matrix.fathertkt.uk için güvenli çıkış
  # ---------------------------------------------------------------------------
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: prism-tunnel
    restart: unless-stopped
    env_file: .env
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN is required}
    command: tunnel --no-autoupdate run
    networks:
      - prism-net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          memory: 32M

  # ---------------------------------------------------------------------------
  # PRISM Website - prismas.net (indirme + duyurular)
  # ---------------------------------------------------------------------------
  website:
    build:
      context: ./prismas.net
      dockerfile: Dockerfile
    container_name: prism-website
    restart: unless-stopped
    env_file: .env
    environment:
      DOMAIN: ${DOMAIN:-prismas.net}
      MATRIX_DOMAIN: ${MATRIX_DOMAIN:-matrix.${DOMAIN:-prismas.net}}
    networks:
      - prism-net
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./data/website/apk:/usr/share/nginx/html/apk:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          memory: 32M

networks:
  prism-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
