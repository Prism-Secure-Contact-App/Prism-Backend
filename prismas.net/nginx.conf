server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip sıkıştırma
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Statik dosyalar için önbellek
    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|apk)$ {
        expires 1M;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # APK dosyaları indirme için
    location /apk/ {
        add_header Content-Disposition "attachment";
        try_files $uri =404;
    }

    # Matrix .well-known delegation (entrypoint.sh tarafından oluşturulan dosyalar)
    location /.well-known/matrix/ {
        add_header Access-Control-Allow-Origin *;
        try_files $uri =404;
    }

    # SPA tarzı yönlendirme
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Güvenlik başlıkları
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
