server {
    listen 80;
    server_name prismas.net www.prismas.net;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Let's Encrypt ACME challenge (certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Gzip sıkıştırma
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Statik dosyalar için önbellek
    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|apk)$ {
        expires 1M;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # APK dosyaları indirme için
    location /apk/ {
        add_header Content-Disposition "attachment";
        add_header Content-Type "application/vnd.android.package-archive";
        try_files $uri =404;
    }

    # Matrix .well-known delegation (entrypoint.sh tarafından oluşturulan dosyalar)
    location /.well-known/matrix/ {
        default_type application/json;
        add_header Access-Control-Allow-Origin *;
        try_files $uri =404;
    }

    # SPA tarzı yönlendirme
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Güvenlik başlıkları
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # CSP: harici fontlar ve inline SVG favicon'a izin verir
    add_header Content-Security-Policy "default-src 'self'; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    # HTTPS aktif olduktan sonra HSTS açılabilir
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
}
